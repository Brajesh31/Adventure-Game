name: Bug report
description: Report a reproducible gameplay, prompt, or runtime problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use fictional player names and values. Do not include passwords, tokens, or private information.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and terminal.
      placeholder: Node 20, Windows 11, PowerShell
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: node game.js
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Remove personal data and secrets before pasting logs.
